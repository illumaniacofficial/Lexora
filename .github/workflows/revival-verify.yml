name: Revival Verify

on:
  push:
    branches:
      - revival/wave-01-foundation
      - revival/wave-04-emergent-runtime
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: revival-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript + Regression + Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Wave 03 regression gate
        run: npm run verify:wave03

      - name: Wave 05 Canon regression gate
        run: npm run verify:wave05

      - name: Production build
        run: npm run build
